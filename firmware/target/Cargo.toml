[package]
name = "openkeys-h573"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
# Intentionally not a default feature or a production authenticator image.
r04-diagnostics = []

[[bin]]
name = "openkeys-r04-diagnostics"
path = "src/main.rs"
required-features = ["r04-diagnostics"]
test = false
bench = false

[target.'cfg(target_arch = "arm")'.dependencies]
openkeys-board = { path = "../board" }
device-policy = { path = "../../crates/device-policy" }
embassy-stm32 = { version = "=0.6.0", features = ["stm32h573ri", "unstable-pac"] }
cortex-m = { version = "=0.7.10", features = ["critical-section-single-core"] }
cortex-m-rt = "=0.7.7"
embedded-hal-bus = "=0.3.0"
embedded-hal = "=1.0.0"
device-vault = { path = "../../crates/device-vault" }
openkeys-se-transport = { path = "../../crates/se-transport" }
openkeys-scp03 = { path = "../../crates/scp03" }
openkeys-h573-crypto = { path = "../../crates/h573-crypto" }
openkeys-secure-mmio = { path = "../secure-mmio" }
zeroize = { version = "1.9", default-features = false }
subtle = { version = "=2.6.1", default-features = false }

[lints]
workspace = true
