[package]
name = "openkeys-secure-mmio"
version.workspace = true
edition.workspace = true
license.workspace = true

[target.'cfg(target_arch = "arm")'.dependencies]
embassy-stm32 = { version = "=0.6.0", features = ["stm32h573ri", "unstable-pac"] }
cortex-m = { version = "=0.7.10", features = ["critical-section-single-core"] }
openkeys-h573-crypto = { path = "../../crates/h573-crypto" }
openkeys-board = { path = "../board" }
openkeys-se-transport = { path = "../../crates/se-transport" }
openkeys-root-flash = { path = "../../crates/root-flash" }
openkeys-root-journal = { path = "../../crates/root-journal" }

# This is the sole own-code exception: eleven fixed MMIO handle constructors
# and aligned words within two fixed secure-flash sectors, explained in README.
# It never accepts a caller pointer/arbitrary address or host programmer request.
[lints.rust]
unsafe_code = "deny"
