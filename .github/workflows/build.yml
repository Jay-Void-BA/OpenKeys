name: OpenKeys development checks
on:
  push:
    paths: ['.gitattributes', 'Cargo.toml', 'Cargo.lock', 'crates/**', 'apps/**', 'firmware/**', 'vendor/**', 'hardware/r04/**', 'hardware/r05/**', 'manufacturing/se-pin-layout-r05.json', 'scripts/*r05*', 'scripts/check-gpui-vendor.py', 'scripts/check-future-compat.py', 'manufacturing/se-state-layout.json', 'scripts/export-se-state-layout.py', 'scripts/check-opensk-vendor.py', 'scripts/export-diagnostic.py', 'scripts/check-diagnostic-manifest.py', 'scripts/diagnostic_contract.py', '.github/workflows/build.yml']
  pull_request:
    paths: ['.gitattributes', 'Cargo.toml', 'Cargo.lock', 'crates/**', 'apps/**', 'firmware/**', 'vendor/**', 'hardware/r04/**', 'hardware/r05/**', 'manufacturing/se-pin-layout-r05.json', 'scripts/*r05*', 'scripts/check-gpui-vendor.py', 'scripts/check-future-compat.py', 'manufacturing/se-state-layout.json', 'scripts/export-se-state-layout.py', 'scripts/check-opensk-vendor.py', 'scripts/export-diagnostic.py', 'scripts/check-diagnostic-manifest.py', 'scripts/diagnostic_contract.py', '.github/workflows/build.yml']
  workflow_dispatch:
    inputs:
      target:
        description: Native platform to check
        type: choice
        default: all
        options: [all, macos, windows, linux]
permissions:
  contents: read
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
jobs:
  dependency-audit:
    if: ${{ inputs.target == 'all' || inputs.target == '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Install auditor
        run: cargo +1.99.1 install cargo-audit --version 0.22.2 --locked
      - name: Reject known vulnerabilities and maintenance warnings
        run: cargo +1.99.1 audit --deny warnings
  native:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.target == 'macos' && '["macos-15"]' || inputs.target == 'windows' && '["windows-2022"]' || inputs.target == 'linux' && '["ubuntu-24.04"]' || '["ubuntu-24.04","macos-15","windows-2022"]') }}
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: "-D warnings"
      RUSTDOCFLAGS: "-D warnings"
      CC: ${{ github.workspace }}/scripts/reject-c-compiler.sh
      CXX: ${{ github.workspace }}/scripts/reject-c-compiler.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Record native target
        run: rustc -vV > native-build-info.txt
      - name: Cortex-M33 board contract and diagnostic image
        if: runner.os == 'Linux'
        run: |
          rustup target add thumbv8m.main-none-eabihf --toolchain 1.99.1
          cargo check -p device-policy -p device-vault -p openkeys-board -p openkeys-se-transport -p openkeys-scp03 -p openkeys-h573-crypto -p openkeys-se-state -p openkeys-authenticator-core --target thumbv8m.main-none-eabihf --locked
          cargo build -p openkeys-h573 --release --target thumbv8m.main-none-eabihf --features r04-diagnostics --locked
          cargo clippy -p openkeys-h573 --target thumbv8m.main-none-eabihf --features r04-diagnostics --locked -- -D warnings
      - name: R05 Cortex-M33 diagnostics and LCD variants
        if: runner.os == 'Linux'
        run: |
          cargo build -p openkeys-h573-r05 --release --target thumbv8m.main-none-eabihf --features r05-diagnostics --locked
          mkdir -p target/r05-diagnostics
          cp target/thumbv8m.main-none-eabihf/release/openkeys-r05-diagnostics target/r05-diagnostics/openkeys-r05-diagnostics-v1-1.elf
          cargo clippy -p openkeys-h573-r05 --target thumbv8m.main-none-eabihf --features r05-diagnostics --locked -- -D warnings
          cargo build -p openkeys-h573-r05 --release --target thumbv8m.main-none-eabihf --features r05-diagnostics,lcd-v1-0 --locked
          cp target/thumbv8m.main-none-eabihf/release/openkeys-r05-diagnostics target/r05-diagnostics/openkeys-r05-diagnostics-v1-0.elf
          cargo clippy -p openkeys-h573-r05 --target thumbv8m.main-none-eabihf --features r05-diagnostics,lcd-v1-0 --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Verify public SE schema
        if: runner.os == 'Linux'
        run: |
          python3 scripts/export-se-state-layout.py --check
          python3 scripts/export-r05-pin-layout.py --check
          python3 scripts/freeze-r05-board.py --check
      - name: Verify diagnostic source and artifact inventory
        if: runner.os == 'Linux'
        run: |
          python3 scripts/check-diagnostic-manifest.py
          python3 scripts/check-r05-diagnostic.py
          python3 scripts/check-gpui-vendor.py
      - name: Verify pinned OpenSK source and patches
        if: runner.os == 'Linux'
        run: python3 scripts/check-opensk-vendor.py
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Format
        run: cargo fmt --all -- --check
      - name: Reject future-incompatible dependencies
        run: python3 scripts/check-future-compat.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: runner.os == 'Linux'
        with:
          name: r05-diagnostic-arm-elf
          path: target/r05-diagnostics/*.elf
          if-no-files-found: error

  gpui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: "-D warnings"
      RUSTDOCFLAGS: "-D warnings"
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Linux native development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfontconfig1-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev libxkbfile-dev libvulkan-dev libxi-dev libxcursor-dev libxrandr-dev libxext-dev libxfixes-dev
      - name: Format feature-gated GPUI view
        run: rustfmt --edition 2024 --check apps/manager-gpui/src/ui.rs
      - name: Check GPUI native backend
        run: cargo check -p openkeys-manager --features gui --locked
      - name: Apple Blocks native ABI and ownership tests
        if: runner.os == 'macOS'
        run: cargo test --manifest-path vendor/gpui-support/block-0.1.6/Cargo.toml --lib
      - name: GPUI model and migrated wire fixtures
        run: cargo test -p openkeys-manager --features gui,wire-tests --lib --tests --locked
      - name: Lint GPUI application
        run: cargo clippy -p openkeys-manager --features gui,wire-tests --all-targets --locked -- -D warnings
      - name: Build GPUI development executable
        run: cargo build -p openkeys-manager --features gui --release --locked
      - name: Reject future-incompatible GUI dependencies
        run: python3 scripts/check-future-compat.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: openkeys-gpui-development-${{ matrix.os }}
          path: |
            target/release/openkeys-manager
            target/release/openkeys-manager.exe
          if-no-files-found: error
