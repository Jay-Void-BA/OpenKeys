name: AuthDesk development checks
on:
  push:
    paths: ['.gitattributes', 'Cargo.toml', 'Cargo.lock', 'crates/**', 'apps/**', 'firmware/**', 'hardware/r04/**', '.github/workflows/build.yml']
  pull_request:
    paths: ['.gitattributes', 'Cargo.toml', 'Cargo.lock', 'crates/**', 'apps/**', 'firmware/**', 'hardware/r04/**', '.github/workflows/build.yml']
  workflow_dispatch:
    inputs:
      target:
        description: Native platform to check
        type: choice
        default: all
        options: [all, macos, windows, linux]
permissions:
  contents: read
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
jobs:
  dependency-audit:
    if: ${{ inputs.target == 'all' || inputs.target == '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Install auditor
        run: cargo +1.99.1 install cargo-audit --version 0.22.2 --locked
      - name: Reject known vulnerabilities and maintenance warnings
        run: cargo +1.99.1 audit --deny warnings
  native:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.target == 'macos' && '["macos-15"]' || inputs.target == 'windows' && '["windows-2022"]' || inputs.target == 'linux' && '["ubuntu-24.04"]' || '["ubuntu-24.04","macos-15","windows-2022"]') }}
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: "-D warnings"
      RUSTDOCFLAGS: "-D warnings"
      CC: ${{ github.workspace }}/scripts/reject-c-compiler.sh
      CXX: ${{ github.workspace }}/scripts/reject-c-compiler.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Record native target
        run: rustc -vV > native-build-info.txt
      - name: Cortex-M33 board contract and diagnostic image
        if: runner.os == 'Linux'
        run: |
          rustup target add thumbv8m.main-none-eabihf --toolchain 1.99.1
          cargo check -p device-policy -p device-vault -p openkeys-board --target thumbv8m.main-none-eabihf --locked
          cargo build -p openkeys-h573 --release --target thumbv8m.main-none-eabihf --features r04-diagnostics --locked
          cargo clippy -p openkeys-h573 --target thumbv8m.main-none-eabihf --features r04-diagnostics --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build development executable
        run: cargo build -p authdesk --release --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: authdesk-development-${{ matrix.os }}
          path: |
            target/release/authdesk
            target/release/authdesk.exe
            native-build-info.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: runner.os == 'Linux'
        with:
          name: r04-diagnostic-arm-elf
          path: target/thumbv8m.main-none-eabihf/release/openkeys-r04-diagnostics
          if-no-files-found: error
