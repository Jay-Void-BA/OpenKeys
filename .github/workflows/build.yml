name: AuthDesk development checks
on:
  workflow_dispatch:
    inputs:
      target:
        description: Native platform to check
        type: choice
        default: all
        options: [all, macos, windows, linux]
permissions:
  contents: read
jobs:
  dependency-audit:
    if: ${{ inputs.target == 'all' || inputs.target == '' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install auditor
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Reject known vulnerabilities and maintenance warnings
        run: cargo audit --deny warnings
  native:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.target == 'macos' && '["macos-15"]' || inputs.target == 'windows' && '["windows-2022"]' || inputs.target == 'linux' && '["ubuntu-22.04"]' || '["ubuntu-22.04","macos-15","windows-2022"]') }}
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ github.workspace }}/scripts/reject-c-compiler.sh
      CXX: ${{ github.workspace }}/scripts/reject-c-compiler.sh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Record native target
        run: rustc -vV > native-build-info.txt
      - name: Tests
        run: cargo test --workspace --locked
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build development executable
        run: cargo build -p authdesk --release --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: authdesk-development-${{ matrix.os }}
          path: |
            target/release/authdesk
            target/release/authdesk.exe
            native-build-info.txt
          if-no-files-found: error
