[workspace]
resolver = "2"
members = ["crates/device-policy", "crates/vault-import", "crates/device-vault", "crates/se-transport", "crates/scp03", "crates/h573-crypto", "crates/se-state", "apps/manager", "firmware/board", "firmware/target", "firmware/secure-mmio"]
default-members = ["crates/device-policy", "crates/vault-import"]
exclude = ["firmware/vendor/cortex-m"]

[patch.crates-io]
# Remove the archived bare-metal compatibility layer; documented maintained
# critical-section replacement, not a RustSec warning exception.
cortex-m = { path = "firmware/vendor/cortex-m" }

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
overflow-checks = true
panic = "abort"

[workspace.lints.rust]
unsafe_code = "forbid"
