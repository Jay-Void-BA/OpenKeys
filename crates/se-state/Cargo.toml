[package]
name = "openkeys-se-state"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Synthetic-object lab qualification only; not a production authorization path.
native-uid-qualification = []

[dependencies]
openkeys-scp03 = { path = "../scp03" }
device-policy = { path = "../device-policy" }
device-vault = { path = "../device-vault" }
openkeys-otp-format = { path = "../otp-format", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
subtle = { version = "=2.6.1", default-features = false }
zeroize = { version = "1.9", default-features = false }
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa"] }

[dev-dependencies]
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes"] }

[lints]
workspace = true
